{{- if .Values.serviceAccount.create -}}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1

metadata:
  name: {{ include "ckic-manager.fullname" . }}
  labels:
    {{- include "ckic-manager.labels" . | nindent 4 }}

rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.config.external.enable }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  {{- end }}

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1

metadata:
  name: {{ include "ckic-manager.fullname" . }}
  labels:
    {{- include "ckic-manager.labels" . | nindent 4 }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ckic-manager.fullname" . }}

subjects:
  - kind: ServiceAccount
    name: {{ include "ckic-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1

metadata:
  name: {{ include "ckic-manager.fullname" . }}
  labels:
    {{- include "ckic-manager.labels" . | nindent 4 }}

rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1

metadata:
  name: {{ include "ckic-manager.fullname" . }}
  labels:
    {{- include "ckic-manager.labels" . | nindent 4 }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ckic-manager.fullname" . }}

subjects:
  - kind: ServiceAccount
    name: {{ include "ckic-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
