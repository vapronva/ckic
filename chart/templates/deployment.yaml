{{- if not (has .Values.loadBalancer.mode (list "none" "cilium" "shared")) }}
{{- fail (printf "loadBalancer.mode must be one of \"none\", \"cilium\", or \"shared\"; got %q" .Values.loadBalancer.mode) }}
{{- end }}
---
kind: Deployment
apiVersion: apps/v1

metadata:
  name: {{ include "ckic-manager.fullname" . }}
  labels:
    {{- include "ckic-manager.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.updateStrategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "ckic-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ckic-manager.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ckic-manager.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.image }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CKIC_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - {{ printf "--node-label=%s" .Values.config.nodeLabel | quote }}
            - {{ printf "--config-map=%s" .Values.config.configMapName | quote }}
            - {{ printf "--bootstrap-default-config=%v" .Values.config.bootstrapDefaultConfig | quote }}
            - {{ printf "--config-resync-interval=%v" .Values.config.configResyncInterval | quote }}
            - {{ printf "--leader-elect=%v" .Values.leaderElection.enabled | quote }}
            - {{ printf "--leader-election-lease-name=%v" .Values.leaderElection.leaseName | quote }}
            - {{ printf "--leader-election-lease-duration=%v" .Values.leaderElection.leaseDuration | quote }}
            - {{ printf "--leader-election-renew-deadline=%v" .Values.leaderElection.renewDeadline | quote }}
            - {{ printf "--leader-election-retry-period=%v" .Values.leaderElection.retryPeriod | quote }}
            {{- if .Values.probes.enabled }}
            - {{ printf "--health-bind-address=:%v" .Values.probes.port | quote }}
            {{- else }}
            - "--health-bind-address="
            {{- end }}
            - {{ printf "--log-level=%s" .Values.config.logLevel | quote }}
            - {{ printf "--caddy-image=%v" .Values.config.caddyImage | quote }}
            - {{ printf "--image-pull-policy=%v" .Values.config.imagePullPolicy | quote }}
            - {{ printf "--prepull-image=%v" .Values.config.prePullImage | quote }}
            - {{ printf "--loadbalancer-mode=%s" (ternary "cilium" "none" (and (not .Values.config.useHostNetwork) (eq .Values.loadBalancer.mode "cilium"))) | quote }}
            - {{ printf "--env-secret=%v" .Values.config.secretName | quote }}
            {{- range .Values.config.secretEnvKeys }}
            - {{ printf "--env-keys=%v" . | quote }}
            {{- end }}
            {{- if .Values.config.dataVolumePVC }}
            - {{ printf "--data-pvc=%v" .Values.config.dataVolumePVC | quote }}
            {{- end }}
            {{- if .Values.config.configVolumePVC }}
            - {{ printf "--config-pvc=%v" .Values.config.configVolumePVC | quote }}
            {{- end }}
            {{- range .Values.config.externalEndpoints }}
            - {{ printf "--external-endpoints=%v" . | quote }}
            {{- end }}
            - {{ printf "--use-host-network=%v" .Values.config.useHostNetwork | quote }}
            {{- if .Values.config.caddyAdminOriginKey }}
            - {{ printf "--caddy-admin-origin-key=%v" .Values.config.caddyAdminOriginKey | quote }}
            {{- end }}
            - {{ printf "--external-enable=%v" .Values.config.external.enable | quote }}
            {{- if .Values.config.external.enable }}
            - {{ printf "--external-label=%v" .Values.config.external.label | quote }}
            {{- if .Values.config.external.allowNamespaces }}
            - {{ printf "--external-allow-namespaces=%s" (join "," .Values.config.external.allowNamespaces) | quote }}
            {{- end }}
            {{- if .Values.config.external.denyNamespaces }}
            - {{ printf "--external-deny-namespaces=%s" (join "," .Values.config.external.denyNamespaces) | quote }}
            {{- end }}
            {{- end }}
            - {{ printf "--external-publish-aggregated=%v" .Values.config.external.publishAggregated | quote }}
            - {{ printf "--external-aggregated-config-name=%v" .Values.config.external.aggregatedConfigName | quote }}
          {{- if .Values.probes.enabled }}
          ports:
            - name: health
              containerPort: {{ .Values.probes.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.probes.livenessInitialDelaySeconds }}
            periodSeconds: {{ .Values.probes.livenessPeriodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: {{ .Values.probes.readinessInitialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readinessPeriodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
